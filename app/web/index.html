<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function () {
      var path = location.pathname;
      // Opened as /volgatech.corp, without the slash, every relative path
      // below would point at the site's root instead: open the folder itself.
      if (!/(\/|\.html?)$/.test(path)) path += '/';
      // A plain-http link (konkin-nikita.ru answers both): the app needs
      // https, without which Safari withholds the crypto that keeps the
      // session. Not for a computer or phone on the local network.
      var local = /^(localhost|127\.|\[::1\]|10\.|192\.168\.)/.test(location.hostname);
      var http = location.protocol === 'http:' && !local;
      if (http || path !== location.pathname) {
        location.replace((http ? 'https://' + location.host : '') +
            path + location.search + location.hash);
      }
    })();
  </script>
  <!-- Relative, so one build works wherever it is published: GitHub Pages
       (/volgatech.corp/), GitVerse Pages (/volgatech.corp/) or a domain's root. -->
  <base href="./">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Расписание, экзамены, профиль и служебные записки сотрудника ПГТУ (Волгатех).">

  <!-- On iPhone, «На экран „Домой“» makes it a full-screen app with the
       app's own blue bar under the clock (the status bar text is white). -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Волгатех">
  <meta name="theme-color" content="#34517B">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Волгатех.Коллектив</title>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #34517B;
    }
    /* Until the app's first frame: the logo, its name, and a bar that moves
       with each step of the start (see flutter_bootstrap.js), so a slow
       connection never looks like a hang. */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      background: radial-gradient(circle at 50% 40%, #46689A 0%, #34517B 55%, #273E60 100%);
      color: #fff;
      font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #splash.done {
      opacity: 0;
      transform: scale(1.03);
    }
    #splash .logo {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: #fff url(icons/Icon-192.png) center / 92% no-repeat;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28), 0 0 0 6px rgba(255, 255, 255, 0.12);
      animation: breathe 2.4s ease-in-out infinite;
    }
    #splash .name {
      margin: 4px 0 0;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    #splash .bar {
      position: relative;
      width: min(240px, 70vw);
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    #splash .fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 3px;
      background: linear-gradient(90deg, #EE6C6C, #FFB199);
      transition: width 0.3s ease-out;
    }
    /* A glint that keeps running even while one step takes long. */
    #splash .fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
      transform: translateX(-100%);
      animation: glint 1.4s ease-in-out infinite;
    }
    #splash .status {
      min-height: 1.4em;
      color: rgba(255, 255, 255, 0.75);
    }
    #splash button {
      display: none;
      padding: 9px 22px;
      border: 0;
      border-radius: 20px;
      background: #fff;
      color: #34517B;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #splash.stuck button {
      display: block;
    }
    #splash.failed .bar {
      display: none;
    }
    @keyframes breathe {
      50% { transform: scale(1.05); }
    }
    @keyframes glint {
      to { transform: translateX(100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash .logo, #splash .fill::after { animation: none; }
    }
    /* Measured by the app (lib/web/insets_web.dart): Flutter's web engine
       leaves the notch / Dynamic Island and the home indicator out. */
    #safe-area-probe {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      visibility: hidden;
      pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
  </style>

  <script>
    // Flutter replaces the viewport tag with its own, which lacks
    // viewport-fit=cover; without it Safari reports no safe-area insets.
    (function () {
      function fit(meta) {
        if (meta.name === 'viewport' && !/viewport-fit/.test(meta.content)) {
          meta.content += ', viewport-fit=cover';
        }
      }
      new MutationObserver(function (records) {
        records.forEach(function (r) {
          r.addedNodes.forEach(function (n) {
            if (n.tagName === 'META') fit(n);
          });
        });
      }).observe(document.head, { childList: true });
    })();
  </script>
</head>
<body>
  <div id="safe-area-probe"></div>
  <div id="splash" role="progressbar" aria-label="Загрузка приложения"
       aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="logo"></div>
    <div class="name">Волгатех.Коллектив</div>
    <div class="bar"><div class="fill"></div></div>
    <div class="status">Загрузка…</div>
    <button type="button" onclick="location.reload()">Обновить</button>
  </div>
  <script>
    // The bar: each step of the start sets how far it may go, and it creeps
    // towards that while the step lasts (a big download can't say how much
    // is left). flutter_bootstrap.js reports the steps.
    window.splash = (function () {
      var el = document.getElementById('splash');
      var fill = el.querySelector('.fill');
      var status = el.querySelector('.status');
      var shown = 0, cap = 0.6, done = false;
      function draw() {
        fill.style.width = (shown * 100).toFixed(1) + '%';
        el.setAttribute('aria-valuenow', Math.round(shown * 100));
      }
      var creep = setInterval(function () {
        shown += (cap - shown) * 0.03;
        draw();
      }, 100);
      // Taking long: say so, then offer to start over.
      var slow = setTimeout(function () {
        if (!done) status.textContent = 'Медленное соединение, ещё немного…';
      }, 8000);
      var stuck = setTimeout(function () {
        if (done) return;
        status.textContent = 'Загрузка затянулась. Можно обновить страницу.';
        el.classList.add('stuck');
      }, 30000);
      function step(at, upTo, text) {
        shown = Math.max(shown, at);
        cap = upTo;
        if (text) status.textContent = text;
        draw();
      }
      function finish() {
        if (done) return;
        done = true;
        keepForOffline();
        clearInterval(creep);
        clearTimeout(slow);
        clearTimeout(stuck);
        shown = 1;
        draw();
        setTimeout(function () {
          el.classList.add('done');
          setTimeout(function () { el.remove(); }, 400);
        }, 150);
      }
      function fail() {
        clearInterval(creep);
        status.textContent = 'Не удалось загрузить приложение. Проверьте подключение.';
        el.classList.add('stuck', 'failed');
      }
      window.addEventListener('flutter-first-frame', finish);
      // The app's script didn't arrive (offline, say): no use waiting.
      window.addEventListener('error', function (e) {
        if (!done && e.target && e.target.tagName === 'SCRIPT') fail();
      }, true);
      return { step: step, fail: fail };
    })();
    // Once the app has started: the files it took, handed to sw.js to keep
    // (the first visit loads them before the worker is there to see).
    function keepForOffline() {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.ready.then(function (reg) {
        var urls = performance.getEntriesByType('resource')
          .map(function (e) { return e.name; })
          .filter(function (u) { return new URL(u).origin === location.origin; });
        urls.push(location.href.split('#')[0]);
        if (reg.active) reg.active.postMessage({ type: 'keep', urls: urls });
      });
    }
    // The app's own files, for opening without a connection (sw.js).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
