name: volgatech_pro
description: "Volgatech PRO — staff cabinet (rebuild). Fast, native, old-device friendly."
publish_to: 'none'
version: 0.4.2+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: any
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  webview_flutter: ^4.7.0
  cupertino_icons: ^1.0.8
  archive: ^4.3.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  xml: ^7.0.1

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/easter/rtf.webp
    - assets/memo/foreign_language_memo.docx
