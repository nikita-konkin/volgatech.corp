name: volgatech_pro
description: "Volgatech PRO — staff cabinet (rebuild). Fast, native, old-device friendly."
publish_to: 'none'
version: 0.5.2+14

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  intl: any
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  webview_flutter: ^4.7.0
  cupertino_icons: ^1.0.8
  archive: ^4.3.0
  share_plus: ^12.0.2
  package_info_plus: ^9.0.1
  enough_mail: ^2.1.7
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  xml: ^6.5.0
  file_picker: ^11.0.3
  open_filex: ^4.7.0
  web: ^1.1.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  workmanager: ^0.10.10
  pdfx: ^2.11.0
  enough_convert: ^1.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/easter/rtf.webp
    - assets/memo/foreign_language_memo.docx
  # Bundled so the web build never fetches Roboto from Google at start-up
  # (without it there would be no text at all where Google is unreachable).
  # The same face Android uses (Apache 2.0, see assets/fonts/).
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
