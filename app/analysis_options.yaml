# Static analysis for the app. `flutter analyze` runs in CI and fails the build
# on any issue (errors, warnings and infos alike).
#
# Base: package:flutter_lints (Dart core + recommended + Flutter rules), plus
# strict type checks and a few extra rules picked for this codebase.
# Suppress a rule for one line with `// ignore: rule_name` — with a reason.
# Rule reference: https://dart.dev/tools/linter-rules

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # No silent implicit casts from `dynamic` — JSON is decoded explicitly.
    strict-casts: true
    # Report places where a type couldn't be inferred and fell back to dynamic.
    strict-inference: true
    # Generic types must have their type arguments (List<X>, not List).
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # Async hygiene: a Future is either awaited or explicitly `unawaited(...)`.
    - discarded_futures
    - unawaited_futures
    - avoid_void_async
    - cancel_subscriptions

    # Type safety and correctness.
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list

    # Rebuild cost: const widgets are canonicalised and skipped on rebuild.
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables

    # Readability / consistency.
    - directives_ordering
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_parenthesis
    - use_named_constants
