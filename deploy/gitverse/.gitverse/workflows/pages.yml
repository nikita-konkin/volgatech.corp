# Runs on GitVerse, in the repository that .github/workflows/web.yml pushes
# the built site to: publishes site/ as GitVerse Pages.
name: Pages

on:
  push:
    # Whichever the repository's default branch is.
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload the site
        uses: gitverse/upload-pages-artifact@v1.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: gitverse/deploy-pages@v1.0.0
