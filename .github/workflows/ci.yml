name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch/PR makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  ios:
    name: Build iOS (unsigned)
    # macOS runners bill ~10x Linux minutes: build iOS once a change lands on
    # main, not on every PR push.
    if: github.event_name == 'push'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # No Apple signing credentials in CI, so build unsigned. This compiles,
      # links, and runs CocoaPods for all iOS plugins (webview_flutter,
      # local_auth, …) — it proves the iOS build is healthy. A signed IPA for
      # TestFlight/App Store needs an Apple Developer account (see README → iOS).
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned .app
        run: |
          cd build/ios/iphoneos
          zip -ryq Runner-unsigned-app.zip Runner.app

      - name: Upload unsigned .app
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: app/build/ios/iphoneos/Runner-unsigned-app.zip
          if-no-files-found: error
