name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch/PR makes the running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: 3.50 deprecates package:flutter/material.dart (material_ui),
          # and `flutter analyze` fails on the infos. Move up together with
          # that migration.
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test portal scripts
        run: node --test

      - name: Build release APKs (per ABI)
        run: flutter build apk --release --split-per-abi

      # The iPhone version (web.yml publishes it): code that only compiles
      # on a phone fails here, not after the merge.
      - name: Build for the browser
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
